
name: Build ROLL RUSH 2 iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Build web game
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate RR2 app icon
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ROLL-RUSH-2.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/ROLL-RUSH-2.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App not found in archive"
            exit 1
          fi
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../../ROLL-RUSH-2.ipa Payload

      - name: Upload ROLL RUSH 2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ROLL-RUSH-2-IPA
          path: ROLL-RUSH-2.ipa
          if-no-files-found: error
